<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Resource Board 2026</title>
  <base href="./" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="vendor-board.css?v=3" />
</head>
<body class="vendor-board-page">
  <div class="vb-app">
    <header class="vb-header" role="banner">
      <div class="vb-header-inner">
        <div class="vb-brand">
          <div class="vb-brand-icon" aria-hidden="true">
            <svg width="40" height="32" viewBox="0 0 64 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Disney Mickey Placeholder">
              <circle cx="32" cy="28" r="14" fill="#0A2A66"/>
              <circle cx="18" cy="14" r="10" fill="#0A2A66"/>
              <circle cx="46" cy="14" r="10" fill="#0A2A66"/>
            </svg>
          </div>
          <div class="vb-brand-text">
            <h1>Vendor Resource Board 2026</h1>
            <p class="vb-share-url" id="vb-share-hint" hidden>
              Share this URL with leadership:
              <code id="vb-share-url"></code>
            </p>
          </div>
        </div>
      </div>
    </header>

    <main class="vb-shell">
      <div id="vendor-board-root" aria-live="polite">
        <p style="padding: 24px 0;">Loading board…</p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.9/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>

  <script src="supabase-config.js?v=1"></script>
  <script src="shared-state.js?v=1"></script>
  <script src="vendor-sheet-sync.js?v=1"></script>
  <script src="vendor-data.js?v=1"></script>
  <script type="text/babel" data-presets="react" src="vendor-board.jsx?v=2"></script>
  <script>
    (function () {
      var el = document.getElementById("vb-share-url");
      var hint = document.getElementById("vb-share-hint");
      if (!el || !hint) return;
      var url = window.location.origin + window.location.pathname;
      if (!/\?publish=1/.test(window.location.search)) {
        el.textContent = url;
        hint.hidden = false;
      }
    })();
  </script>
</body>
</html>
